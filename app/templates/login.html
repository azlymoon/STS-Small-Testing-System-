{% extends "base.html" %}{% block body %}
<div class="card" style="max-width:480px;margin:40px auto">
<h1>{% if lesson %}{{ lesson.title }}{% else %}Вход для учеников{% endif %}</h1>
<p class="mut">Введите фамилию и имя полностью, например: <b>Иванов Пётр</b>. Используйте одно и то же написание на всех уроках.</p>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="post" action="/login"><input type="hidden" name="next" value="{{ next }}">
<p><input type="text" name="name" value="{{ name or '' }}" placeholder="Фамилия Имя" autofocus required></p>

<button>Войти</button></form></div>{% endblock %}
